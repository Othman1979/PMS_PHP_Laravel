<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل · Offline</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f4f6f9; color: #1f2937; margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 1.5rem; }
  .card { background: #fff; border-radius: 1rem; padding: 2rem 1.5rem; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .icon { width: 64px; height: 64px; border-radius: 50%; background: #fee2e2; color: #b91c1c; display: grid; place-items: center; margin: 0 auto 1rem; font-size: 2rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { color: #6b7280; margin: .25rem 0; line-height: 1.6; }
  button { margin-top: 1.25rem; background: #0d6efd; color: #fff; border: 0; border-radius: .6rem; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .en { direction: ltr; font-size: .95rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لم نستطع الوصول إلى نظام الصيانة. تحقق من الشبكة ثم أعد المحاولة؛ طلباتك المحفوظة لن تضيع.</p>
    <p class="en">You're offline. Check your connection and try again — nothing you already sent is lost.</p>
    <button onclick="location.reload()">إعادة المحاولة · Retry</button>
  </div>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
